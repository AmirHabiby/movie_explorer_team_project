<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <h1 class="logo">🎬 Movie Explorer</h1>
        <nav>
            <a href="#" id="homeLink">Home</a>
            <a href="#" id="favLink">Favorites</a>
        </nav>
    </header>

    
    <main id="homePage">
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search movies...">
        </section>

        <section id="moviesContainer" class="movies-container">
           
        </section>
    </main>

    
    <main id="favoritesPage" style="display: none;">
        <h2 class="section-title">Your Favorite Movies</h2>

        <section id="favoritesContainer" class="movies-container">
           
        </section>
    </main>


    <footer class="footer">
        <p>© 2026 Movie Explorer</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
